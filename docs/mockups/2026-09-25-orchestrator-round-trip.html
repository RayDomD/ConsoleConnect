<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Console Connect: assignment round trip</title>

<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--canvas:#F4F2E9;--sidebar:#E5E9DF;--surface:#FCFBF5;--text:#253A30;--muted:#5B6B5E;--border:#CDD5C7;--accent:#2D624B;--on-accent:#FCFBF5;--selection:#DCE6D8;--warning:#805517;--warn-bg:#F6EEDF;--danger:#A02F37;
--well:#F7F6EF;--ring:0 0 0 1px rgb(37 58 48/.08);--lift-1:var(--ring),0 1px 2px rgb(37 58 48/.07);--lift-2:var(--ring),0 1px 2px rgb(37 58 48/.06),0 12px 28px -14px rgb(37 58 48/.22);--lift-3:var(--ring),0 2px 4px rgb(37 58 48/.06),0 24px 48px -16px rgb(37 58 48/.28);--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}body{margin:0;background:#E9E7DE;color:var(--text);font:14px/1.5 'Instrument Sans',sans-serif;font-variant-numeric:tabular-nums;padding:24px 30px 60px}

.head h1{font:400 28px/1.1 Newsreader,serif;letter-spacing:-.02em;margin:0 0 6px}.head p{margin:0 0 16px;color:var(--muted);max-width:96ch}

.t.on,.nav.on{background:var(--surface);box-shadow:var(--lift-1)}

.title h2{font:400 28px/1.08 Newsreader,serif;margin:0 0 8px;letter-spacing:-.02em}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}

.brief{margin-top:16px;max-width:62ch}.brief p{margin:0 0 10px}.brief ul{margin:0 0 10px;padding-left:18px}
.from{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px}
.panel{border-radius:12px;box-shadow:var(--lift-2);padding:16px 18px;margin-top:16px;max-width:680px}
.panel h3{margin:0 0 4px;font:600 14px 'Instrument Sans'}.panel p{margin:0 0 12px;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);padding:8px 14px;font:600 13px 'Instrument Sans';box-shadow:inset 0 1px 0 rgb(255 255 255/.16),0 1px 2px rgb(20 40 30/.25)}
.btn2{border:0;border-radius:8px;background:transparent;color:var(--text);padding:8px 14px;font:500 13px 'Instrument Sans';box-shadow:inset 0 0 0 1px var(--border)}
.ghost{border:0;background:transparent;color:var(--muted);padding:6px 8px;border-radius:8px;font:500 12px 'Instrument Sans'}
.sel{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--border);font-size:13px;background:var(--surface)}
.toolic{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}.cx{background:#1F1F1F}.cl{background:#C66B3D}.ag{background:#3A6FD8}
.frame{display:flex;flex-direction:column;flex:1;min-height:0;margin:14px 20px 18px;border-radius:12px;overflow:hidden;box-shadow:var(--lift-2)}
.strip{display:flex;align-items:center;gap:12px;padding:7px 10px 7px 14px;font-size:12px;color:var(--muted);background:var(--surface);box-shadow:inset 0 -1px 0 var(--border);white-space:nowrap}.strip .sp{flex:1}
.tool{display:inline-flex;align-items:center;gap:7px;color:var(--text);font-weight:600}
.code{font:12px 'JetBrains Mono',monospace}
.term{flex:1;min-height:0;background:var(--well);padding:12px 16px;font:12.5px/1.65 'JetBrains Mono',monospace;overflow:hidden}
.term .p{color:#2D624B}.term .d{color:#62676C}.term .c{color:#355CA8}.term .g{color:#346F4B}.term .y{color:#805517}
.prompt{margin-top:8px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--border);background:var(--surface);padding:8px 10px}
.prompt .hint{font:500 11px 'Instrument Sans';color:var(--warning);margin-bottom:4px}
.cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.banner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--warn-bg);color:var(--warning);font-size:12.5px;font-weight:500}
.banner.ok{background:var(--selection);color:var(--accent)}
.rail{background:var(--surface);box-shadow:inset 1px 0 0 var(--border);padding:14px;font-size:13px;overflow:auto}
.rail h4{margin:0 0 8px;font:600 13px 'Instrument Sans';display:flex;justify-content:space-between}.rail h4 span{color:var(--muted);font-weight:500}
.rail section+section{margin-top:16px}.grp{font-size:12px;color:var(--muted);margin:12px 0 4px}
.item{display:grid;grid-template-columns:8px 1fr auto;gap:2px 9px;align-items:center;padding:7px 9px;border-radius:8px}.item small{grid-column:2/4;color:var(--muted);font-size:12px}.item.hot{background:var(--warn-bg)}
.file{display:flex;justify-content:space-between;font:12px 'JetBrains Mono',monospace;padding:2px 0}.a{color:#346F4B}.x{color:#A02F37}
.toast{position:absolute;right:16px;bottom:16px;width:330px;background:var(--surface);border-radius:12px;box-shadow:var(--lift-3);padding:12px 14px;font-size:13px;animation:rise 240ms var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.toast p{margin:3px 0 10px;color:var(--muted)}
.scrim{position:absolute;inset:0;background:rgb(37 58 48/.18);display:grid;place-items:center}
.modal{width:470px;background:var(--surface);border-radius:14px;box-shadow:var(--lift-3);padding:20px;animation:pop 260ms cubic-bezier(.16,1,.3,1)}@keyframes pop{from{opacity:0;transform:scale(.97)}}
.modal h3{font:400 22px/1.2 Newsreader,serif;margin:6px 0 8px}.modal p{margin:0 0 12px;color:var(--muted);font-size:13px}
.draft{background:var(--canvas);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field div.in{border-radius:8px;box-shadow:inset 0 0 0 1px var(--border);background:var(--surface);padding:8px 10px;font-size:13px}
.src{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}
.pkg dt{font-size:12px;font-weight:600;color:var(--muted);margin-top:12px}.pkg dd{margin:3px 0 0}
.gh{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:99px;background:#E4EAF1;color:#24354D}
/* explain column */
.explain h2{font:400 22px/1.15 Newsreader,serif;margin:0 0 8px;letter-spacing:-.01em}
.explain p{margin:0 0 12px;color:var(--muted)}
.explain .k{font-size:12px;font-weight:600;color:var(--text);margin:14px 0 4px}
.explain ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}.explain li{margin:4px 0}
.explain .rule{font-size:12px;border-radius:8px;background:var(--surface);box-shadow:var(--lift-1);padding:9px 11px;margin-top:14px}
.explain .rule b{display:block;margin-bottom:2px}
.nav2{display:flex;gap:8px;margin-top:18px}
.state{margin-top:14px;font-size:12px;color:var(--muted)}.state code{font:12px 'JetBrains Mono',monospace;color:var(--text);background:var(--surface);padding:1px 6px;border-radius:5px;box-shadow:var(--ring)}
</style></head><body>
<div class="wrap">
<div class="head"><h1>One task, round trip: Blair hands it out, Sam does it, Blair gets it back</h1>
<p>Nine steps across two computers. Blair's orchestrator uses Codex, and Sam works with Claude Code. Use the timeline or <b>←</b> <b>→</b>. The column on the right explains each step, which spec rule it follows, and the task's stored state.</p></div>
<div class="timeline" id="tl"></div>
<div class="stage"><div><div class="device" id="dev"></div><div class="app" id="app"></div></div><div class="explain" id="ex"></div></div>
</div>
<script>
const SAM_BRIEF=`Expired invitations currently fail silently. Show a clear message and a way to ask the owner for a new link.`;
const BRIEF_LIST=`<ul><li>Detect expired tokens in the OAuth callback</li><li>Show a retry banner with "Ask for a new link"</li><li>Add tests for expired and reused links</li></ul>`;
function side(who,tasks,active,extra=''){return `<aside class="side">
 ${who==='blair'?`<div class="nav ${active==='orch'?'on':''}"><span class="dot" style="background:var(--text)"></span>Orchestrator</div>`:''}
 <div class="nav">Team chat</div>
 <div class="h"><span>Tasks</span><span>${tasks.length}</span></div>
 ${tasks.map(t=>`<div class="t ${t.id===active?'on':''}"><i class="dot ${t.d}"></i>${t.n}<small>${t.s}</small></div>`).join('')}
 ${extra}
 <div class="me"><span class="av">${who==='blair'?'B':'S'}</span><div>${who==='blair'?'Blair':'Sam'}<small>${who==='blair'?'Owner':'Contributor'}</small></div></div></aside>`}
function bar(crumb,right=''){return `<div class="bar"><span class="m">Smoke team</span><span class="m">/</span><b>${crumb}</b>${right}<span class="sp"></span><button class="ghost">Chat</button><button class="ghost">Projects</button></div>`}
const tabs=on=>`<div class="ttabs">${['Overview','Console','Package','Discussion'].map(t=>`<span class="${t===on?'on':''}">${t}</span>`).join('')}</div>`;
const S=[
{who:'blair',label:'Blair asks',title:'1. Blair asks the orchestrator to hand out work',
app:()=>`${side('blair',[{id:'x',n:'Review login',s:'Unassigned',d:'ring'}],'orch')}<div class="desk">${bar('Orchestrator','<span class="pill o" style="margin-left:4px">Main folder · no worktree</span>')}
<div class="frame"><div class="strip"><span class="tool"><i class="toolic cx"></i>Codex</span><span class="code" style="color:var(--text)">main</span><span class="sp"></span><button class="ghost">Share view only</button><button class="ghost">Stop</button></div>
<div class="term"><div class="d">Console Connect orchestrator · console-connect is ready</div><div style="margin-top:8px"><span class="p">›</span> Sam should handle the expired invite bug. Write a clear brief and assign it to him, suggest Claude Code.</div>
<div class="d" style="margin-top:6px">  Reading src/oauth-callback.ts, docs/decisions/use-oauth.md</div>
<div class="c">$ console-connect task create "Expired invite retry" \\</div><div class="c">    --brief-file .cc/brief-expired-invite.md --assign sam --suggest claude --decision use-oauth</div>
<div class="g">  ✓ Created as Blair (via Codex) · assigned to Sam · waiting for Sam's approval</div>
<div style="margin-top:6px">Done. Sam gets it as "Awaiting approval". Nothing runs until he approves.</div></div></div></div>`,
explain:`<h2>The orchestrator writes the brief and assigns it</h2><p>Blair types in plain words. Codex looks at the code, writes a brief, and calls the <b>console-connect</b> command, which goes through Blair's open app.</p>
<div class="k">What gets sent</div><ul><li>Title, the brief (description), and a linked decision</li><li>Assignee: Sam. Suggested tool: Claude Code (only a suggestion)</li><li>Recorded as created by Blair, marked "via Codex"</li></ul>
<div class="rule"><b>Spec rule</b>Assignments go to people. A sender can suggest a tool, but the recipient chooses.</div>
<div class="state">Stored state: <code>awaiting_approval</code>, assignee Sam</div>`},
{who:'sam',label:'Sam is notified',title:'2. It arrives on Sam\'s computer',
app:()=>`${side('sam',[{id:'a',n:'Expired invite retry',s:'Awaiting your approval',d:'warn'},{id:'b',n:'Check codex launch',s:'Running',d:''}],'b')}<div class="desk">${bar('Check codex launch')}
<div class="body"><div class="title"><h2>Check codex launch</h2><div class="meta"><span class="pill"><i class="dot"></i>Running</span>Sam · Revision 2</div></div>${tabs('Overview')}<p class="brief" style="color:var(--muted)">Sam is busy with other work…</p></div></div>
<div class="toast"><div class="row"><b>Blair assigned you a task</b><span class="sp"></span><span class="via">via Codex</span></div><p>Expired invite retry · suggests Claude Code</p><div class="row"><button class="btn2">Later</button><button class="btn">Review</button></div></div>`,
explain:`<h2>A notification, not a running terminal</h2><p>The task appears in Sam's sidebar as "Awaiting your approval", and a toast appears. If the app is in the background, it's a desktop notification. Sam's current work isn't interrupted.</p>
<div class="k">If Sam is offline</div><ul><li>The task waits on the host and appears when he reconnects</li><li>It still needs his approval. Nothing runs automatically</li></ul>
<div class="rule"><b>Spec rule</b>Incoming assignments require explicit approval by the recipient before local AI execution starts.</div>
<div class="state">Stored state: <code>awaiting_approval</code></div>`},
{who:'sam',label:'Sam reviews',title:'3. Sam reads the brief and approves',
app:()=>`${side('sam',[{id:'a',n:'Expired invite retry',s:'Awaiting your approval',d:'warn'},{id:'b',n:'Check codex launch',s:'Running',d:''}],'a')}<div class="desk">${bar('Expired invite retry')}
<div class="body"><div class="title"><h2>Expired invite retry</h2><div class="meta"><span class="pill w"><i class="dot warn"></i>Awaiting your approval</span><span class="av" style="width:20px;height:20px;font-size:10px">B</span>From Blair<span class="via">via Codex</span>· 2 min ago</div></div>${tabs('Overview')}
<div class="brief"><p>${SAM_BRIEF}</p>${BRIEF_LIST}<div class="meta">Linked decision: <b style="color:var(--text)">Use OAuth</b> · Suggested tool: <span class="toolic cl" style="width:10px;height:10px"></span> Claude Code</div></div>
<div class="panel"><h3>Take this on?</h3><p>Approving lets you start it on this computer. You pick the tool, and you can ask Blair a question first.</p>
<div class="row"><button class="btn">Approve</button><button class="btn2">Ask a question</button><button class="btn2">Decline</button></div></div></div></div>`,
explain:`<h2>Sam decides</h2><p>The Overview shows who sent it, that the orchestrator wrote it, the full brief, the linked decision, and the suggested tool.</p>
<div class="k">His choices</div><ul><li><b>Approve</b>: the task becomes ready to launch</li><li><b>Ask a question</b>: opens the task discussion. Blair's orchestrator can read and answer it</li><li><b>Decline</b>: returns it to Blair's "Assigned by me" as declined</li></ul>
<div class="rule"><b>Open detail</b>Decline doesn't exist as a command yet (the commands today are approve, claim, and assign). It would need adding.</div>
<div class="state">Stored state after Approve: <code>ready</code></div>`},
{who:'sam',label:'Sam launches',title:'4. Sam picks his tool and launches',
app:()=>`${side('sam',[{id:'a',n:'Expired invite retry',s:'Ready',d:'ring'},{id:'b',n:'Check codex launch',s:'Running',d:''}],'a')}<div class="desk">${bar('Expired invite retry')}
<div class="body" style="display:flex;flex-direction:column"><div class="title"><h2>Expired invite retry</h2><div class="meta"><span class="pill"><i class="dot ring"></i>Ready</span>Sam · From Blair</div></div>${tabs('Console')}
<div class="panel" style="max-width:none"><h3>Start a console for this task</h3><p>The app makes a branch and a separate working folder (a worktree) so this task can't touch your other work.</p>
<div class="row"><span class="sel"><span class="toolic cl"></span>Claude Code ▾</span><span class="meta">Blair suggested Claude Code · Codex and Antigravity are also signed in</span><span class="sp"></span><button class="btn">Launch console</button></div>
<div class="term" style="margin-top:14px;border-radius:8px;flex:none"><div class="d">Checking the Git folder matches github.com/example/demo … ok</div><div class="d">Creating branch task/expired-invite-retry from main … ok</div><div class="d">Creating worktree ..\\cc-wt\\expired-invite-retry … ok</div><div class="d">Starting Claude Code in the worktree …</div></div></div></div></div>`,
explain:`<h2>Launch happens on Sam's machine, with Sam's tool</h2><p>He can take Blair's suggestion or pick another tool he's signed in to. His own account and subscription are used, and nothing from Blair's side is transferred.</p>
<div class="k">What the app does</div><ul><li>Checks the Git folder is this workspace's repository (already built)</li><li>Creates <span class="code">task/expired-invite-retry</span> and a worktree (already built)</li><li>Starts the tool in that folder</li></ul>
<div class="rule"><b>Spec rule</b>Each coding task gets its own branch and worktree. Each person authenticates to tools with their own account.</div>
<div class="state">Stored state: <code>running</code></div>`},
{who:'sam',label:'Brief pre-filled',title:'5. The brief is typed in, but not sent (Q6)',
app:()=>`${side('sam',[{id:'a',n:'Expired invite retry',s:'Running',d:''},{id:'b',n:'Check codex launch',s:'Running',d:''}],'a')}<div class="desk">${bar('Expired invite retry','<span class="pill" style="margin-left:4px"><i class="dot"></i>Running</span>')}
<div class="frame"><div class="strip"><span class="tool"><i class="toolic cl"></i>Claude Code</span><span class="code" style="color:var(--text)">task/expired-invite-retry</span><span>0:12</span><span class="sp"></span><button class="ghost">Share view only</button><button class="ghost">Stop</button><button class="ghost">Session</button><button class="ghost">Focus</button></div>
<div class="banner ok">● Blair's brief is typed into Claude Code's input. Read or edit it, then press Enter to start.</div>
<div class="term"><div class="d">╭ Claude Code ─────────────────────────────╮</div><div class="d">│ cwd: ..\\cc-wt\\expired-invite-retry          │</div><div class="d">╰──────────────────────────────────────────╯</div>
<div class="prompt"><div class="hint">Pre-filled from the task · not sent</div><span class="p">&gt;</span> Task: Expired invite retry (assigned by Blair)<br>&nbsp; ${SAM_BRIEF}<br>&nbsp; - Detect expired tokens in the OAuth callback<br>&nbsp; - Show a retry banner with "Ask for a new link"<br>&nbsp; - Add tests for expired and reused links<br>&nbsp; Decision: docs/decisions/use-oauth.md<span class="cursor"></span></div></div></div></div>`,
explain:`<h2>No copying and pasting, and Sam stays in control</h2><p>After the tool starts, the app types the brief into its input box without pressing Enter. Sam can read it, change it, add his own notes, and start it himself.</p>
<div class="k">Why not auto-send</div><ul><li>His AI would act on Blair's words before he read them</li><li>The spec says each person controls execution on their machine</li></ul>
<div class="rule"><b>Build risk</b>Each tool has to be ready to accept input before the text is typed. That needs a per-tool "ready" signal, which the spec already expects for tool-specific integration.</div>
<div class="state">Stored state: <code>running</code> · session on Sam's computer</div>`},
{who:'sam',label:'Sam works',title:'6. Sam\'s AI works, and Sam can share a view',
app:()=>`${side('sam',[{id:'a',n:'Expired invite retry',s:'Running',d:''},{id:'b',n:'Check codex launch',s:'Running',d:''}],'a')}<div class="desk" style="grid-column:2">${bar('Expired invite retry','<span class="pill" style="margin-left:4px"><i class="dot"></i>Running</span>')}
